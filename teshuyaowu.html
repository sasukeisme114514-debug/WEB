<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特殊药物清单 - 汕泽私立医院机密档案</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei","SimHei",sans-serif;
}
body{
    background:#1a0000;
    color:#ffd6d6;
    min-height:100vh;
}

/* 顶部栏 */
.top-bar{
    background:#2a0000;
    color:#ff6666;
    padding:16px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #440000;
}
.top-bar h1{
    font-size:clamp(18px,4vw,22px);
    letter-spacing:1px;
}
.back-btn{
    color:#ff6666;
    background:#330000;
    padding:7px 12px;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;
    border:1px solid #550000;
    cursor:pointer;
}
.back-btn:hover{
    background:#440000;
}

/* 正文容器 */
.container{
    max-width:900px;
    margin:30px auto;
    padding:0 16px;
}
.content-box{
    background:#220000;
    border-radius:10px;
    padding:30px 28px;
    box-shadow:0 0 25px rgba(139,0,0,0.6);
    border:1px solid #440000;
}
.content-box h2{
    color:#ff4d4d;
    padding-bottom:12px;
    border-bottom:1px solid #550000;
    margin-bottom:20px;
    font-size:22px;
}
.content-box p{
    line-height:1.8;
    font-size:15px;
    color:#ffd6d6;
    margin-bottom:14px;
    text-indent:2em;
}
.note-tip{
    margin-top:24px;
    padding:14px 16px;
    background:#110000;
    border-left:3px solid #ff3333;
    font-size:14px;
    color:#cc9999;
    line-height:1.7;
}

footer{
    margin-top:60px;
    text-align:center;
    color:#777;
    padding:22px 10px;
    font-size:13px;
}

@media screen and (max-width:768px){
    .content-box{
        padding:20px 16px;
    }
    .content-box h2{
        font-size:19px;
    }
}

/* 颤抖+乱码效果 */
.shake-text{
    animation: shakeText 0.35s infinite ease-in-out;
}
.garbage-text{
    color:#ff0000;
    text-shadow:0 0 6px #ff0000;
}
@keyframes shakeText{
    0%{transform:translate(0.4px,-0.4px);}
    25%{transform:translate(-0.4px,0.3px);}
    50%{transform:translate(0.3px,0.4px);}
    75%{transform:translate(-0.3px,-0.3px);}
    100%{transform:translate(0.4px,-0.4px);}
}
</style>
</head>
<body>

<div class="top-bar">
    <h1>机密档案详情</h1>
    <button class="back-btn" onclick="history.back()">返回上一页</button>
</div>

<div class="container">
    <div class="content-box">
        <!-- ========== 以下内容可自行修改 ========== -->
        <h2 class="shake-text">特殊药物清单</h2>

        <p class="shake-text">（填写第一段药物介绍内容）</p>

        <p class="shake-text">（填写第二段药物说明内容）</p>

        <p class="shake-text">（填写第三段，可自行增减段落，保留 class="shake-text" 即可）</p>

        <div class="note-tip shake-text">
            （填写底部机密备注/警告内容）
        </div>
        <!-- ========== 以上内容可自行修改 ========== -->
    </div>
</div>

<footer>
    山河省汕泽市私立医院 · 内部管理系统 · 机密级权限
</footer>

<!-- 阴森背景音 -->
<audio id="bgm" loop muted>
    <source src="https://www.soundjay.com/ambient/sounds/ambient-horror-01.mp3" type="audio/mpeg">


<script>
// 未登录自动跳回登录页，必须放在script最开头
if(localStorage.getItem('hospitalLogin') !== 'true'){
    window.location.href = 'login.html';
}

const bgm = document.getElementById('bgm');

// 1. 随机乱码闪烁效果
const garbageChars = ['█','▓','▒','░','☠','⚠','✖','▣','▤','▥','▦','▧','▨','▩','▪','▫','◆','◇','○','●'];
setInterval(()=>{
    const shakeTexts = document.querySelectorAll('.shake-text');
    const randomEl = shakeTexts[Math.floor(Math.random() * shakeTexts.length)];
    if(!randomEl) return;

    const originalText = randomEl.dataset.original || randomEl.innerText;
    randomEl.dataset.original = originalText;

    let garbage = '';
    for(let i = 0; i < 8; i++){
        garbage += garbageChars[Math.floor(Math.random() * garbageChars.length)];
    }

    randomEl.classList.add('garbage-text');
    randomEl.innerText = garbage;

    setTimeout(()=>{
        randomEl.innerText = originalText;
        randomEl.classList.remove('garbage-text');
    }, 180);
}, 1200);

// 2. 点击页面播放BGM
document.addEventListener('click', ()=>{
    bgm.muted = false;
    bgm.play().catch(()=>{});
}, {once:true});

// ========== 固定顺序按键彩蛋 ==========
// 自定义按键顺序（全部小写，按顺序依次按下才触发）
const secretCode = ['s','e','c','r','e','t'];
// 验证通过后跳转的隐藏页面地址
const secretPage = 'yincang.html';
let codeIndex = 0;

document.addEventListener('keydown', function(e){
    // 排除输入框、文本框，避免打字时误触
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    
    const currentKey = e.key.toLowerCase();
    
    if(currentKey === secretCode[codeIndex]){
        // 按对了，进度+1
        codeIndex++;
        // 全部按对，触发跳转
        if(codeIndex === secretCode.length){
            window.location.href = secretPage;
            codeIndex = 0; // 重置进度
        }
    }else{
        // 按错了，重置进度，重新开始
        codeIndex = 0;
    }
});
// ========== 手机端固定顺序滑动彩蛋 ==========
// 滑动顺序：up=从下往上滑  left=从右往左滑，避开系统自带手势
const swipeSecretCode = ['up', 'left'];
// 验证通过后跳转的隐藏页面
const swipeSecretPage = 'yincang.html';
// 触发阈值：垂直滑动阈值更大，避免正常滚动误触发
const horizontalThreshold = 40; // 水平滑动最小距离
const verticalThreshold = 80;   // 垂直滑动最小距离

let swipeCodeIndex = 0;
let startX = 0;
let startY = 0;

document.addEventListener('touchstart', function(e){
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, {passive: true});

document.addEventListener('touchend', function(e){
    // 排除输入框，避免打字时误触
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;

    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - startX;
    const dy = endY - startY;
    let dir = '';

    // 判断主滑动方向
    if(Math.abs(dx) > Math.abs(dy)){
        // 水平滑动
        if(Math.abs(dx) >= horizontalThreshold){
            dir = dx > 0 ? 'right' : 'left';
        }
    }else{
        // 垂直滑动
        if(Math.abs(dy) >= verticalThreshold){
            dir = dy > 0 ? 'down' : 'up';
        }
    }

    if(!dir) return;

    // 验证滑动顺序
    if(dir === swipeSecretCode[swipeCodeIndex]){
        swipeCodeIndex++;
        // 全部正确，触发跳转
        if(swipeCodeIndex === swipeSecretCode.length){
            window.location.href = swipeSecretPage;
            swipeCodeIndex = 0;
        }
    }else{
        // 滑错重置
        swipeCodeIndex = 0;
    }
}, {passive: true});


</script>

</body>
</html>

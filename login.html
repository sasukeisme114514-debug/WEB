<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医护人员登录 - 汕泽私立医院</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei","SimHei",sans-serif;
}
body{
    background:#f0f2f5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 16px;
}
.login-card{
    background:#fff;
    width:100%;
    max-width:380px;
    padding:40px 32px;
    border-radius:8px;
    box-shadow:0 2px 16px rgba(0,0,0,0.08);
}
.login-card h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:32px;
    font-size:20px;
    font-weight:normal;
}
.form-group{
    margin-bottom:20px;
}
.form-group label{
    display:block;
    color:#666;
    font-size:14px;
    margin-bottom:8px;
}
.form-group input{
    width:100%;
    height:42px;
    padding:0 12px;
    border:1px solid #dcdfe6;
    border-radius:4px;
    font-size:14px;
    outline:none;
    transition:border-color 0.2s;
}
.form-group input:focus{
    border-color:#409eff;
}
.login-btn{
    width:100%;
    height:44px;
    background:#409eff;
    color:#fff;
    border:none;
    border-radius:4px;
    font-size:15px;
    cursor:pointer;
    margin-top:8px;
    transition:background 0.2s;
}
.login-btn:hover{
    background:#66b1ff;
}
.error-tip{
    color:#f56c6c;
    font-size:13px;
    text-align:center;
    margin-top:16px;
    min-height:18px;
}
</style>
</head>
<body>
    <div class="login-card">
        <h2>医护人员内部系统登录</h2>
        <div class="form-group">
            <label>工号账号</label>
            <input type="text" id="usr" placeholder="请输入工号账号">
        </div>
        <div class="form-group">
            <label>访问密码</label>
            <input type="password" id="pwd" placeholder="请输入访问密码">
        </div>
        <button class="login-btn" onclick="doLogin()">登 录</button>
        <div class="error-tip" id="errMsg"></div>
    </div>

<script>
// ========== 可自行修改账号密码 ==========
const rightUser = 'Nurse Liu 45721';
const rightPwd = 'szsslyynurse45721';
// 登录成功后跳转的后台首页
const adminPage = 'admin.html';

function doLogin(){
    const u = document.getElementById('usr').value.trim();
    const p = document.getElementById('pwd').value.trim();
    const err = document.getElementById('errMsg');

    if(!u || !p){
        err.innerText = '请输入账号和密码';
        return;
    }

    if(u === rightUser && p === rightPwd){
        // 登录成功，记录状态到本地，关闭浏览器也会保留
        localStorage.setItem('hospitalLogin', 'true');
        localStorage.setItem('loginUser', u);
        // 跳转到后台首页
        window.location.href = adminPage;
    }else{
        err.innerText = '账号或密码错误，请重新输入';
    }
}

// 回车快捷登录
document.addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>

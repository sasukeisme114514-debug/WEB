<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结局：敲诈勒索 | 汕泽私立医院</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei", "SimSun", serif;
}
body{
    background:#f7f3ed;
    color:#2c2c2c;
    min-height:100vh;
    line-height:1.9;
    padding:20px;
}
.container{
    max-width:700px;
    margin:60px auto;
    padding:0 20px;
}
.ending-title{
    font-size:22px;
    font-weight:bold;
    text-align:center;
    margin-bottom:40px;
    color:#1a1a1a;
    letter-spacing:1px;
    opacity:0;
    transform:translateY(12px);
    transition:all 0.8s ease;
}
.ending-title.show{
    opacity:1;
    transform:translateY(0);
}
.fade-text{
    opacity:0;
    transform:translateY(12px);
    transition:all 0.8s ease;
    margin-bottom:18px;
    font-size:16px;
    text-indent:2em;
}
.fade-text.show{
    opacity:1;
    transform:translateY(0);
}
.back-box{
    text-align:center;
    margin-top:50px;
    display:none;
}
.back-btn{
    display:inline-block;
    padding:10px 28px;
    border:1px solid #666;
    color:#333;
    text-decoration:none;
    border-radius:6px;
    font-size:14px;
    transition:all 0.3s ease;
}
.back-btn:hover{
    background:#333;
    color:#fff;
}
#contentWrap{
    transition:opacity 1.2s ease;
}
.final-end{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:48px;
    color:#222;
    letter-spacing:12px;
    opacity:0;
    transition:opacity 1.5s ease;
    pointer-events:none;
}
.final-end.show{
    opacity:1;
}

</style>
</head>
<body>
    <div class="container">
        <h2 class="ending-title">结局 · 敲诈勒索</h2>

        <!-- 在这里填写你的结局内容，每一段用 <p class="fade-text"> 包裹 -->
        <p class="fade-text">你用捡到的手机向李建国发去了掌握的所有证据</p>
        <p class="fade-text">李建国看到大惊，问你想做什么</p>
        <p class="fade-text">你让他给你1000w，他居然答应了，约你在医院顶楼，你爽快赴约</p>
        <p class="fade-text">他突然将你迷晕</p>
        <p class="fade-text">你醒了，发现自己处在一片黑暗之中，动弹不得，大脑却十分清醒</p>

        <div class="back-box" id="backBox">
            <a href="truth.html" class="back-btn">返回真相页</a>
        </div>
    </div>

<script>
// 登录校验，未登录自动跳回登录页
if(localStorage.getItem('hospitalLogin') !== 'true'){
    window.location.href = 'login.html';
}

// 逐行浮现效果
// 全部文字显示完 → 正文淡出 → 浮现「完」
const totalTime = 800 + textList.length * delay;
setTimeout(() => {
    document.getElementById('contentWrap').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('finalEnd').classList.add('show');
    }, 1200);
}, totalTime + 1000);


// 先显示标题
setTimeout(() => {
    title.classList.add('show');
}, 300);

// 再逐行显示正文
textList.forEach((el, index) => {
    setTimeout(() => {
        el.classList.add('show');
    }, 800 + index * delay);
});

// 全部显示完后出现返回按钮
setTimeout(() => {
    backBox.style.display = 'block';
}, 800 + textList.length * delay + 500);
</script>
</body>
</html>

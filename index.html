<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汕泽私立总院｜官方首页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f5f7fa;color:#333;}
header{background:#004b82;color:#fff;padding:20px 16px;}
.header-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.logo-text h1{font-size:24px;}
.logo-text p{font-size:13px;opacity:0.85;}
.nav a{color:#fff;text-decoration:none;margin:0 12px;font-size:15px;}
.nav a:hover{text-decoration:underline;}

.banner{background:#e8f2fc;padding:40px 16px;}
.banner-inner{max-width:1200px;margin:0 auto;}
.banner h2{font-size:28px;margin-bottom:10px;color:#003a66;}
.banner p{font-size:16px;color:#444;max-width:700px;line-height:1.7;}

.container{max-width:1200px;margin:32px auto;padding:0 16px;}
.grid-box{display:grid;grid-template-columns:repeat(auto‑fit,minmax(260px,1fr));gap:20px;margin:30px 0;}
.card{background:#fff;padding:22px 18px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,0.07);}
.card h3{color:#004b82;margin-bottom:8px;font-size:18px;}
.card p{font-size:14px;line-height:1.6;color:#555;}

.enter-admin{
    display:inline-block;margin-top:14px;
    background:#005b96;color:#fff;padding:9px 16px;border-radius:6px;
    text-decoration:none;font-size:14px;
}

footer{margin-top:60px;padding:24px 16px;background:#222;color:#aaa;font-size:13px;}
.footer-inner{max-width:1200px;margin:0 auto;line-height:1.8;}
</style>
</head>
<body>
<header>
    <div class="header-wrap">
        <div class="logo-text">
            <h1>汕泽私立总院</h1>
            <p>山河省汕泽市解放路346号</p>
        </div>
        <div class="nav">
            <a href="/index.html">首页</a>
            <a href="#">科室介绍</a>
            <a href="#">预约挂号</a>
            <a href="#">就医指南</a>
            <a href="#">联系我们</a>
        </div>
    </div>

    </div>
</section>

        <div class="card">

        <div class="card">

            <p>开设多栋住院大楼，床位充足，配套完善护理服务。部分特殊病区不对外公开。</p>
        </div>
        <div class="card">

            <p>医护人员专用内部管理后台入口，仅限本院授权工作人员访问。<br>
            <a href="/nurse.html" class="enter-admin">护士管理后台入口</a>
            </p>
        </div>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <p>汕泽私立总院｜地址：山河省汕泽市解放路346号</p>

    </div>
</footer>
</body>
</html>

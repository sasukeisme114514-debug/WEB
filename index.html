<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汕泽私立医院｜官方首页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f5f7fa;color:#333;}
header{background:#004b82;color:#fff;padding:20px 16px;}
.header-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.logo-text h1{font-size:24px;}
.logo-text p{font-size:13px;opacity:0.85;}
.nav a{color:#fff;text-decoration:none;margin:0 12px;font-size:15px;cursor:pointer;}
.nav a:hover{text-decoration:underline;}

.banner{background:#e8f2fc;padding:40px 16px;}
.banner-inner{max-width:1200px;margin:0 auto;}
.banner h2{font-size:28px;margin-bottom:10px;color:#003a66;}
.banner p{font-size:16px;color:#444;max-width:700px;line-height:1.7;}

.container{max-width:1200px;margin:32px auto;padding:0 16px;}
.grid-box{display:grid;grid-template-columns:repeat(auto‑fit,minmax(260px,1fr));gap:20px;margin:30px 0;}
.card{background:#fff;padding:22px 18px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,0.07);}
.card h3{color:#004b82;margin-bottom:8px;font-size:18px;}
.card p{font-size:14px;line-height:1.6;color:#555;}

.enter-admin{
    display:inline-block;margin-top:14px;
    background:#005b96;color:#fff;padding:9px 16px;border-radius:6px;
    text-decoration:none;font-size:14px;cursor:pointer;
}

footer{margin-top:60px;padding:24px 16px;background:#222;color:#aaa;font-size:13px;}
.footer-inner{max-width:1200px;margin:0 auto;line-height:1.8;}

/*登录弹窗*/
.modal-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);
    display:none;z-index:999;
}
.modal-box{
    width:90%;max-width:420px;background:#fff;margin:120px auto;padding:26px;border-radius:10px;
}
.modal-box h3{margin-bottom:18px;color:#004b82;}
.form-item{margin-bottom:14px;}
.form-item label{display:block;font-size:14px;margin-bottom:4px;}
.form-item input{width:100%;padding:10px 12px;border:1px solid #ccd6e0;border-radius:5px;font-size:15px;}
.modal-buttons{display:flex;gap:10px;margin-top:20px;}
.btn-login{flex:1;padding:10px;background:#005b96;color:#fff;border:none;border-radius:5px;cursor:pointer;}
.btn-close{flex:1;padding:10px;background:#eee;border:none;border-radius:5px;cursor:pointer;}
.err-tip{color:#c82423;font-size:13px;margin-top:8px;display:none;}

/*官网子页面弹窗*/
.page-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);
    display:none;z-index:900;
}
.page-wrap{
    width:92%;max-width:800px;background:#fff;margin:60px auto;border-radius:10px;
    max-height:85vh;overflow-y:auto;
}
.page-head{
    background:#004b82;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;
}
.page-head h3{font-size:18px;}
.page-close{
    background:none;border:none;color:#fff;font-size:22px;cursor:pointer;
}
.page-body{
    padding:22px 20px;
    line-height:1.75;
    color:#333;
    font-size:15px;
}
</style>
</head>
<body>
<header>
    <div class="header-wrap">
        <div class="logo-text">
            <h1>汕泽私立医院</h1>
            <p>山河省汕泽市解放路346号</p>
        </div>
        <div class="nav">
            <a onclick="showPage('home')">首页</a>
            <a onclick="showPage('dept')">科室介绍</a>
            <a onclick="showPage('reg')">预约挂号</a>
            <a onclick="showPage('guide')">就医指南</a>
            <a onclick="showPage('contact')">联系我们</a>
        </div>
    </div>
</header>

<section class="banner">
    <div class="banner-inner">
        <h2>欢迎来到汕泽私立医院</h2>
        <p>本院集医疗、护理、康复为一体，为广大市民提供专业诊疗服务。院内严格执行各项医疗管理制度，保障患者就医安全。</p>
    </div>
</section>

<div class="container">
    <div class="grid-box">
        <div class="card">
            <h3>门诊服务</h3>
            <p>内科、外科、妇产科、急诊科等常规门诊，工作日全天接诊，急诊24小时值守。</p>
        </div>
        <div class="card">
            <h3>住院病区</h3>
            <p>开设多栋住院大楼，床位充足，配套完善护理服务。部分特殊病区不对外公开。</p>
        </div>
        <div class="card">
            <h3>医护内部系统</h3>
            <p>护士、医师专用内部管理后台入口，仅限本院授权工作人员访问。<br>
            <span class="enter-admin" id="openLogin">打开医护登录入口</span>
            </p>
        </div>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <p>汕泽私立总院｜地址：山河省汕泽市解放路346号</p>
        <p>本网站为医院官方站点，外部人员禁止访问内部管理系统</p>
    </div>
</footer>


<!--官网导航子页面弹窗 -->
<div class="page-mask" id="pageMask">
    <div class="page-wrap">
        <div class="page-head">
            <h3 id="pageTitle"></h3>
            <button class="page-close" id="closePage">×</button>
        </div>
        <div class="page-body" id="pageBody">
        </div>
    </div>
</div>

<script>
// 点击登录按钮，跳转到独立登录页
document.getElementById('openLogin').onclick = () => {
    window.location.href = 'login.html';
};

// index内部子页面
const pageMask = document.getElementById('pageMask');
const pageTitle = document.getElementById('pageTitle');
const pageBody = document.getElementById('pageBody');
document.getElementById('closePage').onclick = ()=> pageMask.style.display='none';

const pageData = {
    dept:{
        title:"科室介绍",
        html:`
<p><strong>内科</strong>：常见慢性病、呼吸、消化类疾病诊疗。</p>
<p><strong>外科</strong>：常规门诊手术、外伤处置。</p>
<p><strong>妇产科</strong>：妇科诊疗、孕期基础检查。</p>
<p><strong>急诊科</strong>：24小时急诊接诊。</p>
<p><strong>康复科</strong>：术后康复理疗服务。</p>
<br>
<p><em>注：本院部分住院病区信息不对外公示，仅院内工作人员可见。</em></p>
`
    },
    reg:{
        title:"预约挂号",
        html:`
<p>门诊挂号时间：周一至周五 08:00‑17:00</p>
<p>急诊全天候开放，无需预约。</p>
<p>可现场窗口挂号，暂不支持线上预约。</p>
<p>就诊请携带身份证。</p>
<br>
<p>提示：住院床位不接受普通市民自主预约。</p>
`
    },
    guide:{
        title:"就医指南",
        html:`
<p>1、到达医院先到一楼大厅分诊台咨询。</p>
<p>2、挂号后前往对应科室候诊区排队。</p>
<p>3、凭医生处方到药房取药。</p>
<p>4、如需住院，由医生开具住院单办理入院。</p>
<br>
<p>医院大楼西侧旧楼区域请勿随意靠近，非开放区域。</p>
`
    },
    contact:{
        title:"联系我们",
        html:`
<p>医院地址：山河省汕泽市解放路346号</p>
<p>门诊咨询：工作日 8:30‑16:30</p>
<p>急诊：24小时值守</p>
<br>
<p>内部医护联系请走院内通讯系统，外部公众无法访问内部后台。</p>
`
    },
    home:{
        title:"首页",
        html:""
    }
}

function showPage(key){
    if(key === 'home'){
        pageMask.style.display = 'none';
        return;
    }
    const item = pageData[key];
    pageTitle.innerText = item.title;
    pageBody.innerHTML = item.html;
    pageMask.style.display = 'block';
}
</script>
</body>
</html>

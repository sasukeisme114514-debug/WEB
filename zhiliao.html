<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特殊治疗方式 - 汕泽医院内部档案</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei","SimHei",sans-serif;
}
body{
    background:#1a0000;
    color:#ffd6d6;
    min-height:100vh;
}

/* 顶部栏 */
.top-bar{
    background:#2a0000;
    color:#ff6666;
    padding:16px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:1px solid #440000;
}
.top-bar h1{
    font-size:clamp(18px,4vw,22px);
    letter-spacing:1px;
}
.back-btn{
    color:#ff6666;
    text-decoration:none;
    background:#330000;
    padding:7px 12px;
    border-radius:6px;
    font-size:14px;
    border:1px solid #550000;
    cursor:pointer;
}
.back-btn:hover{
    background:#440000;
}

/* 正文容器 */
.container{
    max-width:900px;
    margin:30px auto;
    padding:0 16px;
}
.content-box{
    background:#220000;
    border-radius:10px;
    padding:30px 28px;
    box-shadow:0 0 25px rgba(139,0,0,0.6);
    border:1px solid #440000;
}
.content-box h2{
    color:#ff4d4d;
    padding-bottom:12px;
    border-bottom:1px solid #550000;
    margin-bottom:20px;
    font-size:22px;
}
.content-box p{
    line-height:1.8;
    font-size:15px;
    color:#ffd6d6;
    margin-bottom:14px;
    text-indent:2em;
}
.note-tip{
    margin-top:24px;
    padding:14px 16px;
    background:#110000;
    border-left:3px solid #ff3333;
    font-size:14px;
    color:#cc9999;
    line-height:1.7;
}

footer{
    margin-top:60px;
    text-align:center;
    color:#777;
    padding:22px 10px;
    font-size:13px;
}

/* 移动端适配 */
@media screen and (max-width:768px){
    .content-box{
        padding:20px 16px;
    }
    .content-box h2{
        font-size:19px;
    }
}

/* 颤抖动画 */
.shake-text{
    animation: shakeText 0.35s infinite ease-in-out;
}
.garbage-text{
    color:#ff0000;
    text-shadow:0 0 6px #ff0000;
}

@keyframes shakeText{
    0%{transform:translate(0.4px,-0.4px);}
    25%{transform:translate(-0.4px,0.3px);}
    50%{transform:translate(0.3px,0.4px);}
    75%{transform:translate(-0.3px,-0.3px);}
    100%{transform:translate(0.4px,-0.4px);}
}
</style>
</head>
<body>

<div class="top-bar">
    <h1>院内档案详情</h1>
    <button class="back-btn" onclick="history.back()">返回上一页</button>
</div>

<div class="container">
    <div class="content-box">
        <!-- ========== 以下内容可自行修改 ========== -->
        <h2 class="shake-text">特殊治疗方式 档案</h2>

        <p class="shake-text">（在濒死的病人最终无法治疗后，送入七号住院部，开展“特殊治疗”）</p>

        <p class="shake-text">（通过“特殊药物”的静脉注射，可以有效治疗患者，延长患者生命。但是“稍”有副作用）</p>

        <p class="shake-text">（▓▒█░▣▤▥▦▧▨▩▪▫◆◇○●☠⚠✖orsxg5bamfrwgyiy▀▄█▌▐░▒▓▔▕■□▲△▼▽◆◇○●◐◑◒◓◔◕☠☢☣⚠）</p>

        <div class="note-tip shake-text">
            （系统提示：▪▫◆◇┾决对对吥允许进荇有關特殊药粅の探查┾▓▒█░▣▤▥▦▧┾决对对吥允许进荇有關特殊药粅の探查┾▔▕■□▲△▼▽◆）
        </div>
        <!-- ========== 以上内容可自行修改 ========== -->
    </div>
</div>

<footer>
山河省汕泽市解放路346号 汕泽私立医院内部管理系统 · 仅限授权医护访问
</footer>

<!-- 阴森背景音 -->
<audio id="bgm" loop muted>
    <source src="https://www.soundjay.com/ambient/sounds/ambient-horror-01.mp3" type="audio/mpeg">


<script>
const bgm = document.getElementById('bgm');

// 随机乱码闪烁效果
const garbageChars = ['█','▓','▒','░','☠','⚠','✖','▣','▤','▥','▦','▧','▨','▩','▪','▫','◆','◇','○','●'];
const shakeTexts = document.querySelectorAll('.shake-text');

setInterval(()=>{
    const randomEl = shakeTexts[Math.floor(Math.random() * shakeTexts.length)];
    if(!randomEl) return;

    const originalText = randomEl.dataset.original || randomEl.innerText;
    randomEl.dataset.original = originalText;

    let garbage = '';
    for(let i = 0; i < 8; i++){
        garbage += garbageChars[Math.floor(Math.random() * garbageChars.length)];
    }

    randomEl.classList.add('garbage-text');
    randomEl.innerText = garbage;

    setTimeout(()=>{
        randomEl.innerText = originalText;
        randomEl.classList.remove('garbage-text');
    }, 180);
}, 1200);

// 点击页面后解除静音播放BGM
document.addEventListener('click', ()=>{
    bgm.muted = false;
    bgm.play().catch(()=>{});
}, {once:true});
</script>

</body>
</html>
